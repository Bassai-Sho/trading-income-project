[project]
# Disable telemetry — local deployment
enable_telemetry = false

# No user-provided env vars needed (serve_model.py handles .env)
user_env = []

[features]
# Allow markdown with embedded HTML (for trading data tables)
unsafe_allow_html = true

# Single-model setup — no multi-modal file uploads needed
multi_modal = false

# Prompt playground disabled — we have custom settings panel
prompt_playground = false

[UI]
name = "Trading AI"
description = "Intel Arc iGPU · Qwen3.8-27B · OpenVINO GenAI"
default_theme = "dark"
layout = "wide"

# Hide the Chainlit watermark
hide_cta = true

[UI.theme]
# Dark trading-terminal colour palette
primary = "#4f8ef7"
background = "#0f1117"
paper = "#1a1d26"

[meta]
generated_by = "trading-income-project"
