[project]
enable_telemetry = false
user_env = []

[features]
unsafe_allow_html = true
multi_modal = true
edit_message = true

[features.spontaneous_file_upload]
    enabled = true
    accept = ["image/*", "application/pdf", "text/csv", "text/plain", "application/json"]
    max_files = 3
    max_size_mb = 10

[UI]
name = "Trading AI"
description = "Intel Arc iGPU · Qwen3.8-27B · OpenVINO GenAI"
default_theme = "dark"
layout = "wide"
hide_cta = true

# Don't show readme as default — hides the watermark/logo area
show_readme_as_default = false

# Custom CSS and JS
custom_css = "/public/custom.css"
custom_js = "/public/header.js"

[meta]
generated_by = "trading-income-project"
