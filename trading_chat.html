<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading AI Chat</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d26;
    --border: #2a2d3a;
    --text: #e2e4ed;
    --muted: #6b7280;
    --accent: #4f8ef7;
    --user-bg: #1e2a3a;
    --ai-bg: #1a1d26;
    --error: #ef4444;
    --success: #22c55e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 15px;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  .status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--error);
  }
  .dot.connected { background: var(--success); }
  .model-label {
    font-size: 12px;
    color: var(--muted);
    background: var(--border);
    padding: 2px 8px;
    border-radius: 4px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg {
    display: flex;
    gap: 12px;
    max-width: 860px;
    width: 100%;
  }
  .msg.user { flex-direction: row-reverse; margin-left: auto; }
  .avatar {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    background: var(--border);
  }
  .msg.user .avatar { background: var(--accent); }
  .bubble {
    background: var(--ai-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble {
    background: var(--user-bg);
    border-color: #2a3a50;
  }
  .cursor {
    display: inline-block;
    width: 2px; height: 16px;
    background: var(--accent);
    margin-left: 2px;
    animation: blink 1s infinite;
    vertical-align: text-bottom;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  .thinking {
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
  }
  footer {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 16px 20px;
    flex-shrink: 0;
  }
  .input-row {
    display: flex;
    gap: 10px;
    max-width: 860px;
    margin: 0 auto;
  }
  #input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    resize: none;
    outline: none;
    min-height: 44px;
    max-height: 200px;
    line-height: 1.5;
    transition: border-color 0.15s;
  }
  #input:focus { border-color: var(--accent); }
  #input::placeholder { color: var(--muted); }
  #send {
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
    white-space: nowrap;
  }
  #send:disabled { opacity: 0.4; cursor: not-allowed; }
  #send:not(:disabled):hover { opacity: 0.85; }
  .meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    display: flex;
    gap: 12px;
  }
  .settings {
    max-width: 860px;
    margin: 0 auto 10px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .settings label { font-size: 12px; color: var(--muted); }
  .settings input, .settings select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    color: var(--text);
    font-size: 12px;
    font-family: inherit;
  }
  .settings input[type=number] { width: 70px; }
  #clear-btn {
    margin-left: auto;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
  }
  #clear-btn:hover { border-color: var(--text); color: var(--text); }
  .error-msg { color: var(--error); }
  .stats { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>

<header>
  <div>🧠</div>
  <h1>Trading AI</h1>
  <span class="model-label" id="model-label">connecting...</span>
  <div class="status">
    <div class="dot" id="status-dot"></div>
    <span id="status-text">Checking...</span>
  </div>
</header>

<div id="messages"></div>

<footer>
  <div class="settings">
    <label>Server:</label>
    <input type="text" id="server-url" value="http://localhost:8000" style="width:180px">
    <label>Max tokens:</label>
    <input type="number" id="max-tokens" value="1024" min="10" max="1024">
    <label>Temp:</label>
    <input type="number" id="temperature" value="0.2" min="0" max="2" step="0.1">
    <button id="clear-btn" onclick="clearChat()">Clear chat</button>
  </div>
  <div class="input-row">
    <textarea id="input" placeholder="Ask anything about trading..." rows="1"
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button id="send" onclick="sendMessage()">Send</button>
  </div>
</footer>

<script>
const messages = [];
let isGenerating = false;
let modelId = '';
let startTime = 0;
let tokenCount = 0;

async function checkServer() {
  const url = document.getElementById('server-url').value.replace(/\/$/, '');
  try {
    const r = await fetch(`${url}/v1/models`, { mode: 'cors' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    modelId = d.data?.[0]?.id || 'unknown';
    document.getElementById('model-label').textContent = modelId;
    document.getElementById('status-dot').className = 'dot connected';
    document.getElementById('status-text').textContent = 'Connected';
  } catch(e) {
    document.getElementById('status-dot').className = 'dot';
    document.getElementById('status-text').textContent = 'Disconnected';
    document.getElementById('model-label').textContent = 'offline';
    console.error('Connection failed:', e.message, `URL: ${url}/v1/models`);
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!isGenerating) sendMessage();
  }
}

function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '👤' : '🤖';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;
  div.appendChild(avatar);
  div.appendChild(bubble);
  document.getElementById('messages').appendChild(div);
  div.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return bubble;
}

function clearChat() {
  messages.length = 0;
  document.getElementById('messages').innerHTML = '';
}

async function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || isGenerating) return;

  input.value = '';
  input.style.height = 'auto';
  isGenerating = true;
  document.getElementById('send').disabled = true;

  // Add user message
  messages.push({ role: 'user', content: text });
  addMessage('user', text);

  // Add AI bubble
  const bubble = addMessage('assistant', '');
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  bubble.appendChild(cursor);

  startTime = Date.now();
  tokenCount = 0;
  let fullText = '';

  const url = document.getElementById('server-url').value;
  const maxTokens = parseInt(document.getElementById('max-tokens').value) || 1024;
  const temperature = parseFloat(document.getElementById('temperature').value) || 0.2;

  try {
    const response = await fetch(`${url}/v1/chat/completions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: modelId,
        messages: messages,
        max_tokens: maxTokens,
        temperature: temperature,
        stream: true
      })
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${await response.text()}`);
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') break;
        try {
          const chunk = JSON.parse(data);
          const delta = chunk.choices?.[0]?.delta?.content || '';
          if (delta) {
            fullText += delta;
            tokenCount++;
            // Update bubble - remove cursor, set text, re-add cursor
            bubble.textContent = fullText;
            bubble.appendChild(cursor);
            bubble.scrollIntoView({ behavior: 'smooth', block: 'end' });
          }
        } catch {}
      }
    }

    // Final: remove cursor, add stats
    cursor.remove();
    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    const tps = (tokenCount / elapsed).toFixed(1);
    const stats = document.createElement('div');
    stats.className = 'stats';
    stats.textContent = `${tokenCount} tokens · ${tps} tok/s · ${elapsed}s`;
    bubble.parentElement.appendChild(stats);

    messages.push({ role: 'assistant', content: fullText });

  } catch(e) {
    cursor.remove();
    bubble.textContent = `Error: ${e.message}`;
    bubble.classList.add('error-msg');
    console.error(e);
  }

  isGenerating = false;
  document.getElementById('send').disabled = false;
  document.getElementById('input').focus();
}

// Check server on load and every 30s
checkServer();
setInterval(checkServer, 30000);
</script>
</body>
</html>
