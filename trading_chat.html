<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading AI Chat</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d26; --border: #2a2d3a;
    --text: #e2e4ed; --muted: #6b7280; --accent: #4f8ef7;
    --user-bg: #1e2a3a; --ai-bg: #1a1d26;
    --error: #ef4444; --success: #22c55e; --warn: #f59e0b;
    --tool-bg: #0d1a2a; --tool-border: #1e3a5f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif;
         font-size: 15px; height: 100vh; display: flex; flex-direction: column; }
  header { background: var(--surface); border-bottom: 1px solid var(--border);
           padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  header h1 { font-size: 16px; font-weight: 600; }
  .status { margin-left: auto; display: flex; align-items: center; gap: 6px;
            font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--error); }
  .dot.connected { background: var(--success); }
  .model-label { font-size: 12px; color: var(--muted); background: var(--border);
                 padding: 2px 8px; border-radius: 4px; }
  .tools-badge { font-size: 11px; color: var(--warn); background: #1a1500;
                 border: 1px solid #3a2a00; padding: 2px 8px; border-radius: 4px; }
  #messages { flex: 1; overflow-y: auto; padding: 20px;
              display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; gap: 12px; max-width: 900px; width: 100%; }
  .msg.user { flex-direction: row-reverse; margin-left: auto; }
  .avatar { width: 32px; height: 32px; border-radius: 8px; display: flex;
            align-items: center; justify-content: center; font-size: 14px;
            flex-shrink: 0; background: var(--border); }
  .msg.user .avatar { background: var(--accent); }
  .msg-content { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
  .bubble { background: var(--ai-bg); border: 1px solid var(--border); border-radius: 12px;
            padding: 12px 16px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .msg.user .bubble { background: var(--user-bg); border-color: #2a3a50; }
  .tool-call { background: var(--tool-bg); border: 1px solid var(--tool-border);
               border-radius: 8px; padding: 10px 14px; font-size: 12px; font-family: monospace; }
  .tool-call .tool-name { color: var(--accent); font-weight: 600; margin-bottom: 4px; }
  .tool-call .tool-args { color: var(--muted); white-space: pre-wrap; margin-bottom: 6px; }
  .tool-call .tool-status { color: var(--warn); font-size: 11px; }
  .tool-call .tool-status.done { color: var(--success); }
  .tool-result { background: #0a1a0a; border: 1px solid #1a3a1a; border-radius: 8px;
                 padding: 10px 14px; font-size: 12px; font-family: monospace;
                 color: #a0d0a0; white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
  .cursor { display: inline-block; width: 2px; height: 16px; background: var(--accent);
            margin-left: 2px; animation: blink 1s infinite; vertical-align: text-bottom; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  .stats { color: var(--muted); font-size: 11px; margin-top: 2px; }
  footer { background: var(--surface); border-top: 1px solid var(--border);
           padding: 12px 20px; flex-shrink: 0; }
  .settings { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
              max-width: 900px; margin: 0 auto 10px; }
  .settings label { font-size: 12px; color: var(--muted); }
  .settings input, .settings select { background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; color: var(--text); font-size: 12px; font-family: inherit; }
  .settings input[type=number] { width: 70px; }
  .settings input[type=checkbox] { width: 14px; height: 14px; accent-color: var(--accent); }
  #clear-btn { margin-left: auto; background: transparent; border: 1px solid var(--border);
               border-radius: 6px; padding: 4px 10px; color: var(--muted); font-size: 12px; cursor: pointer; }
  #clear-btn:hover { border-color: var(--text); color: var(--text); }
  .input-row { display: flex; gap: 10px; max-width: 900px; margin: 0 auto; }
  #input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
           padding: 10px 14px; color: var(--text); font-size: 15px; font-family: inherit;
           resize: none; outline: none; min-height: 44px; max-height: 200px;
           line-height: 1.5; transition: border-color 0.15s; }
  #input:focus { border-color: var(--accent); }
  #input::placeholder { color: var(--muted); }
  #send { background: var(--accent); border: none; border-radius: 10px; padding: 10px 18px;
          color: white; font-size: 14px; font-weight: 600; cursor: pointer;
          transition: opacity 0.15s; white-space: nowrap; }
  #send:disabled { opacity: 0.4; cursor: not-allowed; }
  #send:not(:disabled):hover { opacity: 0.85; }
  .error-msg { color: var(--error); }
</style>
</head>
<body>
<header>
  <div>🧠</div>
  <h1>Trading AI</h1>
  <span class="model-label" id="model-label">connecting...</span>
  <span class="tools-badge" id="tools-badge" style="display:none">🔧 Tools</span>
  <div class="status">
    <div class="dot" id="status-dot"></div>
    <span id="status-text">Checking...</span>
  </div>
</header>
<div id="messages"></div>
<footer>
  <div class="settings">
    <label>Server:</label>
    <input type="text" id="server-url" value="http://localhost:8000" style="width:180px">
    <label>Max tokens:</label>
    <input type="number" id="max-tokens" value="1024" min="10" max="1024">
    <label>Temp:</label>
    <input type="number" id="temperature" value="0.2" min="0" max="2" step="0.1">
    <label><input type="checkbox" id="use-tools" checked> Web search</label>
    <button id="clear-btn" onclick="clearChat()">Clear chat</button>
  </div>
  <div class="input-row">
    <textarea id="input" placeholder="Ask anything — web search enabled..." rows="1"
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button id="send" onclick="sendMessage()">Send</button>
  </div>
</footer>
<script>
const messages=[];let isGenerating=false,modelId='',availableTools=[];
async function checkServer(){
  const url=document.getElementById('server-url').value.replace(/\/$/,'');
  try{
    const r=await fetch(`${url}/v1/models`,{mode:'cors'});
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const d=await r.json();
    modelId=d.data?.[0]?.id||'unknown';
    document.getElementById('model-label').textContent=modelId;
    document.getElementById('status-dot').className='dot connected';
    document.getElementById('status-text').textContent='Connected';
    await loadTools(url);
  }catch(e){
    document.getElementById('status-dot').className='dot';
    document.getElementById('status-text').textContent='Disconnected';
    document.getElementById('model-label').textContent='offline';
  }
}
async function loadTools(url){
  try{
    const r=await fetch(`${url}/v1/tools`,{mode:'cors'});
    if(!r.ok)return;
    const d=await r.json();
    availableTools=d.tools||[];
    const badge=document.getElementById('tools-badge');
    if(availableTools.length>0){badge.style.display='';badge.textContent=`🔧 ${availableTools.length} tools`;}
  }catch(e){availableTools=[];}
}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,200)+'px';}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(!isGenerating)sendMessage();}}
function clearChat(){messages.length=0;document.getElementById('messages').innerHTML='';}
function scrollToBottom(){const m=document.getElementById('messages');m.scrollTop=m.scrollHeight;}
function addMessage(role,content){
  const div=document.createElement('div');div.className=`msg ${role}`;
  const av=document.createElement('div');av.className='avatar';av.textContent=role==='user'?'👤':'🤖';
  const mc=document.createElement('div');mc.className='msg-content';
  const b=document.createElement('div');b.className='bubble';b.textContent=content;
  mc.appendChild(b);div.appendChild(av);div.appendChild(mc);
  document.getElementById('messages').appendChild(div);scrollToBottom();
  return{div,msgContent:mc,bubble:b};
}
function addToolCall(mc,toolName,toolArgs){
  const tc=document.createElement('div');tc.className='tool-call';
  tc.innerHTML=`<div class="tool-name">🔧 ${toolName}</div><div class="tool-args">${JSON.stringify(toolArgs,null,2)}</div><div class="tool-status">⏳ Running...</div>`;
  mc.appendChild(tc);scrollToBottom();return tc;
}
function updateToolCall(tc,result){
  tc.querySelector('.tool-status').className='tool-status done';
  tc.querySelector('.tool-status').textContent='✅ Done';
  const rd=document.createElement('div');rd.className='tool-result';
  rd.textContent=result.slice(0,800)+(result.length>800?'\n...(truncated)':'');
  tc.appendChild(rd);scrollToBottom();
}
async function executeTool(toolName,toolArgs){
  const url=document.getElementById('server-url').value.replace(/\/$/,'');
  const r=await fetch(`${url}/v1/tools/call`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:toolName,arguments:toolArgs})});
  if(!r.ok)throw new Error(`Tool HTTP ${r.status}`);
  const d=await r.json();return d.result||'(no result)';
}
async function sendMessage(){
  const input=document.getElementById('input');
  const text=input.value.trim();
  if(!text||isGenerating)return;
  input.value='';input.style.height='auto';
  isGenerating=true;document.getElementById('send').disabled=true;
  const useTools=document.getElementById('use-tools').checked&&availableTools.length>0;
  const url=document.getElementById('server-url').value.replace(/\/$/,'');
  const maxTokens=parseInt(document.getElementById('max-tokens').value)||1024;
  const temperature=parseFloat(document.getElementById('temperature').value)||0.2;
  messages.push({role:'user',content:text});
  addMessage('user',text);
  const{msgContent,bubble}=addMessage('assistant','');
  const cursor=document.createElement('span');cursor.className='cursor';bubble.appendChild(cursor);
  const startTime=Date.now();
  let fullText='',toolCalls=[];
  try{
    const body={model:modelId,messages,max_tokens:maxTokens,temperature,stream:!useTools};
    if(useTools)body.tools=availableTools;
    if(useTools){
      // Non-streaming for tool loop
      const r=await fetch(`${url}/v1/chat/completions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!r.ok)throw new Error(`HTTP ${r.status}: ${await r.text()}`);
      const data=await r.json();
      const choice=data.choices?.[0];
      if(choice?.finish_reason==='tool_calls'&&choice?.message?.tool_calls?.length>0){
        toolCalls=choice.message.tool_calls;
        bubble.textContent='';
        const toolResults=[];
        for(const tc of toolCalls){
          const toolName=tc.function?.name||tc.name;
          let toolArgs={};
          try{toolArgs=JSON.parse(tc.function?.arguments||tc.arguments||'{}');}catch{}
          const tcDiv=addToolCall(msgContent,toolName,toolArgs);
          let result='';
          try{result=await executeTool(toolName,toolArgs);updateToolCall(tcDiv,result);}
          catch(e){result=`Error: ${e.message}`;updateToolCall(tcDiv,result);}
          toolResults.push({tool_call_id:tc.id,role:'tool',content:result});
        }
        // Follow-up streaming call with tool results
        bubble.textContent='';bubble.appendChild(cursor);
        const r2=await fetch(`${url}/v1/chat/completions`,{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({model:modelId,messages:[...messages,choice.message,...toolResults],max_tokens:maxTokens,temperature,stream:true})
        });
        if(!r2.ok)throw new Error(`HTTP ${r2.status}`);
        const reader=r2.body.getReader();const decoder=new TextDecoder();let buffer='';
        while(true){
          const{done,value}=await reader.read();if(done)break;
          buffer+=decoder.decode(value,{stream:true});
          const lines=buffer.split('\n');buffer=lines.pop();
          for(const line of lines){
            if(!line.startsWith('data: '))continue;
            const d=line.slice(6).trim();if(d==='[DONE]')break;
            try{const chunk=JSON.parse(d);const delta=chunk.choices?.[0]?.delta?.content||'';
              if(delta){fullText+=delta;bubble.textContent=fullText;bubble.appendChild(cursor);scrollToBottom();}}catch{}
          }
        }
      }else{
        fullText=choice?.message?.content||'';bubble.textContent=fullText;
      }
    }else{
      // Pure streaming
      const r=await fetch(`${url}/v1/chat/completions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!r.ok)throw new Error(`HTTP ${r.status}: ${await r.text()}`);
      const reader=r.body.getReader();const decoder=new TextDecoder();let buffer='';
      while(true){
        const{done,value}=await reader.read();if(done)break;
        buffer+=decoder.decode(value,{stream:true});
        const lines=buffer.split('\n');buffer=lines.pop();
        for(const line of lines){
          if(!line.startsWith('data: '))continue;
          const d=line.slice(6).trim();if(d==='[DONE]')break;
          try{const chunk=JSON.parse(d);const delta=chunk.choices?.[0]?.delta?.content||'';
            if(delta){fullText+=delta;bubble.textContent=fullText;bubble.appendChild(cursor);scrollToBottom();}}catch{}
        }
      }
    }
    cursor.remove();
    const elapsed=((Date.now()-startTime)/1000).toFixed(1);
    const wordCount=fullText.split(/\s+/).filter(Boolean).length;
    const stats=document.createElement('div');stats.className='stats';
    const toolNote=toolCalls.length>0?` · ${toolCalls.length} tool call(s)`:'';
    stats.textContent=`~${wordCount} words · ${elapsed}s${toolNote}`;
    msgContent.appendChild(stats);
    messages.push({role:'assistant',content:fullText});
  }catch(e){
    cursor.remove();bubble.textContent=`Error: ${e.message}`;bubble.classList.add('error-msg');
    console.error(e);
  }
  isGenerating=false;document.getElementById('send').disabled=false;
  document.getElementById('input').focus();
}
checkServer();setInterval(checkServer,30000);
</script>
</body>
</html>
