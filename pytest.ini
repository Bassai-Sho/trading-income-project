[pytest]
filterwarnings =
    # alpaca-py imports websockets.legacy in its streaming modules
    # (alpaca/trading/stream.py, alpaca/data/live/websocket.py). Still true in
    # alpaca-py 0.44.0, the latest release on 26 Sep 2026; websockets 17.1 is
    # the latest too, so there is no newer version to move to yet. Not our
    # code, and we do not use Alpaca streaming. Scoped to this one message
    # from this one module, so any other deprecation (ours included) still
    # shows. Remove when alpaca-py drops websockets.legacy.
    ignore:websockets.legacy is deprecated:DeprecationWarning:websockets.legacy
